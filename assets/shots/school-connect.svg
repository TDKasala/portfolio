<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- page background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- top nav -->
  <rect x="0" y="0" width="1280" height="78" fill="#ffffff" opacity="0.08"/>
  <g transform="translate(56,26)">
    <text x="40" y="22" font-size="26">🎓</text>
    <text x="78" y="22" fill="#ffffff" font-size="22" font-weight="700">SchoolConnect<tspan fill="#fbbf24"> Africa</tspan></text>
  </g>
  <g fill="#ffffff" opacity="0.85" font-size="16" font-weight="500">
    <text x="900" y="48">Schools</text>
    <text x="1000" y="48">Resources</text>
    <text x="1120" y="48">About</text>
  </g>

  <!-- hero -->
  <g transform="translate(56,170)">
    <rect x="0" y="0" rx="999" width="240" height="34" fill="#ffffff" opacity="0.14"/>
    <text x="22" y="23" fill="#ffffff" font-size="14" font-weight="600" letter-spacing="1">EMPOWERING EDUCATION</text>

    <text x="0" y="120" fill="#ffffff" font-size="62" font-weight="800">Connecting Schools</text>
    <text x="0" y="190" fill="#ffffff" font-size="62" font-weight="800">Across <tspan fill="#fbbf24">Africa</tspan></text>

    <text x="0" y="245" fill="#ffffff" opacity="0.85" font-size="22" font-weight="400">A platform linking schools, students, and learning</text>
    <text x="0" y="278" fill="#ffffff" opacity="0.85" font-size="22" font-weight="400">resources — all in one place.</text>

    <!-- buttons -->
    <rect x="0" y="320" rx="12" width="200" height="56" fill="url(#btn)"/>
    <text x="100" y="356" fill="#0f172a" font-size="19" font-weight="700" text-anchor="middle">Get Started</text>
    <rect x="220" y="320" rx="12" width="180" height="56" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="310" y="356" fill="#ffffff" font-size="19" font-weight="600" text-anchor="middle">Explore</text>
  </g>

  <!-- floating preview cards (right) -->
  <g transform="translate(780,180)">
    <rect x="0" y="0" rx="18" width="420" height="120" fill="#ffffff" opacity="0.97"/>
    <circle cx="46" cy="60" r="26" fill="#1e3a8a"/>
    <text x="46" y="69" font-size="24" text-anchor="middle">🏫</text>
    <rect x="88" y="38" rx="6" width="220" height="14" fill="#1e293b"/>
    <rect x="88" y="64" rx="6" width="290" height="11" fill="#94a3b8"/>
    <rect x="88" y="82" rx="6" width="180" height="11" fill="#cbd5e1"/>

    <rect x="40" y="150" rx="18" width="420" height="120" fill="#ffffff" opacity="0.97"/>
    <circle cx="86" cy="210" r="26" fill="#0f766e"/>
    <text x="86" y="219" font-size="24" text-anchor="middle">📚</text>
    <rect x="128" y="188" rx="6" width="200" height="14" fill="#1e293b"/>
    <rect x="128" y="214" rx="6" width="280" height="11" fill="#94a3b8"/>
    <rect x="128" y="232" rx="6" width="150" height="11" fill="#cbd5e1"/>

    <rect x="0" y="300" rx="18" width="420" height="120" fill="#ffffff" opacity="0.97"/>
    <circle cx="46" cy="360" r="26" fill="#f59e0b"/>
    <text x="46" y="369" font-size="24" text-anchor="middle">🎓</text>
    <rect x="88" y="338" rx="6" width="230" height="14" fill="#1e293b"/>
    <rect x="88" y="364" rx="6" width="300" height="11" fill="#94a3b8"/>
    <rect x="88" y="382" rx="6" width="170" height="11" fill="#cbd5e1"/>
  </g>
</svg>
